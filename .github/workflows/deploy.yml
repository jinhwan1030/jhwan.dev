name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

concurrency:
  group: jhwan-homepage-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 의존성 설치
        run: npm ci

      - name: CMS 설정 검사
        run: node scripts/validate-cms-config.mjs

      - name: CMS 설정 회귀 테스트
        run: node scripts/validate-cms-config.test.mjs

      - name: Astro 검사
        run: npm run check

      - name: 홈페이지 빌드 및 초안 비공개 검사
        run: node scripts/validate-blog-output.mjs

      - name: 내부 링크와 SEO 산출물 검사
        run: node scripts/validate-site-output.mjs

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v4

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: legyeseul
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 빌드 & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            legyeseul/jhwan-homepage:latest
            legyeseul/jhwan-homepage:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
