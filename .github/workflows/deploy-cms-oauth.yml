name: Deploy CMS OAuth Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cms-oauth.yml'
      - 'deploy/cloudflare/cms-oauth/**'
  workflow_dispatch:

concurrency:
  group: deploy-cms-oauth
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare/cms-oauth
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Worker 검사
        run: npm run check

      - name: OAuth 흐름 테스트
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: cms-oauth
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: deploy/cloudflare/cms-oauth
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cloudflare 배포 설정 확인
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare GitHub Secrets가 없어 Worker 배포를 건너뜁니다.'
          fi

      - name: Worker 배포
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npx --yes wrangler@4.123.0 deploy
