<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0f172a" />
    <title>jhwan.dev 글 관리</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <style>
      html {
        background: #f1f5f9;
      }

      body {
        margin: 0;
        color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .loading {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }

      .loading[hidden] {
        display: none;
      }

      .loading-card {
        width: min(22rem, 100%);
        padding: 2rem;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 18px 45px rgb(15 23 42 / 8%);
      }

      .loading strong {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 1.2rem;
      }

      .loading span {
        color: #64748b;
        font-size: 0.9rem;
      }

      .loading[data-state="error"] span {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="loading" id="cms-loading" aria-live="polite">
      <div class="loading-card">
        <strong>jhwan.dev 글 관리</strong>
        <span id="cms-loading-message">관리 화면을 불러오는 중입니다.</span>
      </div>
    </div>
    <script>
      function cmsLoaded() {
        document.getElementById("cms-loading").hidden = true;
      }

      function cmsLoadFailed() {
        const loading = document.getElementById("cms-loading");
        loading.dataset.state = "error";
        document.getElementById("cms-loading-message").textContent =
          "관리 화면을 불러오지 못했습니다. 잠시 후 새로고침해주세요.";
      }
    </script>
    <script
      src="https://unpkg.com/@sveltia/cms@0.172.4/dist/sveltia-cms.js"
      onload="cmsLoaded()"
      onerror="cmsLoadFailed()"
    ></script>
  </body>
</html>
